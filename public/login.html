<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zone Thumbnail Generator — 로그인</title>
<style>
  :root {
    --bg: #030303;
    --panel: #0e0e0e;
    --panel-border: #232323;
    --text: #e8e8e8;
    --text-dim: #8a8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #111 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  form {
    width: 100%;
    max-width: 320px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 28px;
    margin: 16px;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 20px;
  }
  input {
    width: 100%;
    background: #050505;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 12px 16px;
    background: #fff;
    color: #030303;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  p.error {
    color: #ff9d9d;
    font-size: 13px;
    margin: 0 0 12px;
  }
</style>
</head>
<body>
  <form id="loginForm">
    <h1>Zone Thumbnail Generator</h1>
    <p class="error" id="errorMsg" hidden></p>
    <input type="password" id="password" placeholder="비밀번호" autofocus />
    <button type="submit" id="submitBtn">입장</button>
  </form>

  <script>
    const form = document.getElementById("loginForm");
    const passwordEl = document.getElementById("password");
    const errorEl = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      submitBtn.disabled = true;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: passwordEl.value }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || "로그인에 실패했어요.";
          errorEl.hidden = false;
          return;
        }

        window.location.href = "/";
      } catch (err) {
        errorEl.textContent = "네트워크 오류가 발생했어요.";
        errorEl.hidden = false;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
