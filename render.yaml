services:
  - type: web
    name: icon-thumbnail-generator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: GITHUB_DATA_REPO
        value: jinbytt/icon-thumbnail-data
      - key: GITHUB_TOKEN
        sync: false
